services:
  - type: web
    name: hw-manager-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GLOBAL_SUPABASE_URL
        sync: false
      - key: GLOBAL_SUPABASE_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
